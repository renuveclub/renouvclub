    <meta name="description" content="Un club étudiant qui sensibilise et agit pour les énergies renouvelables et la protection de l'environnement.">
    <style>
        :root {
            --green-dark: #0f2a1c;
            --green-mid: #1e3d2b;
            --green-soft: #2e4a30;
            --gold: #c9a227;
            --gold-light: #e0c35a;
            --gold-pale: #f5e6b8;
            --cream: #fdfaf3;
            --cream-dark: #f5f0e1;
            --text-main: #1a2f1c;
            --text-soft: #3d5a40;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: 
                radial-gradient(ellipse at 20% 10%, rgba(201, 162, 39, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(30, 61, 43, 0.08) 0%, transparent 45%),
                linear-gradient(160deg, #f8f4e8 0%, #f0ebe0 50%, #e8f0e4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: var(--text-main);
        }

        /* Main card */
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--cream);
            border-radius: 28px;
            box-shadow: 
                0 25px 50px -12px rgba(15, 42, 28, 0.18),
                0 0 0 1px rgba(201, 162, 39, 0.15);
            position: relative;
            overflow: hidden;
            padding: 0 0 32px;
        }

        /* Top gold-green bar */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, 
                var(--green-dark) 0%, 
                var(--gold) 25%, 
                var(--gold-light) 50%, 
                var(--gold) 75%, 
                var(--green-dark) 100%);
        }

        /* Corner ribbons – top left */
        .ribbon {
            position: absolute;
            width: 140px;
            height: 140px;
            pointer-events: none;
            z-index: 2;
        }

        .ribbon-tl {
            top: -10px;
            left: -10px;
            background: 
                radial-gradient(circle at 30% 30%, rgba(201,162,39,0.25) 0%, transparent 60%),
                linear-gradient(135deg, var(--green-dark) 0%, #1a3a28 40%, transparent 70%);
            border-radius: 0 0 80% 0;
            clip-path: polygon(0 0, 100% 0, 0 100%);
            opacity: 0.9;
        }

        .ribbon-tr {
            top: -10px;
            right: -10px;
            background: 
                radial-gradient(circle at 70% 30%, rgba(201,162,39,0.25) 0%, transparent 60%),
                linear-gradient(225deg, var(--green-dark) 0%, #1a3a28 40%, transparent 70%);
            border-radius: 0 0 0 80%;
            clip-path: polygon(100% 0, 0 0, 100% 100%);
            opacity: 0.9;
        }

        .ribbon-bl {
            bottom: -10px;
            left: -10px;
            background: 
                radial-gradient(circle at 30% 70%, rgba(201,162,39,0.2) 0%, transparent 55%),
                linear-gradient(45deg, var(--green-dark) 0%, #1a3a28 40%, transparent 70%);
            border-radius: 0 80% 0 0;
            clip-path: polygon(0 100%, 100% 100%, 0 0);
            opacity: 0.85;
        }

        .ribbon-br {
            bottom: -10px;
            right: -10px;
            background: 
                radial-gradient(circle at 70% 70%, rgba(201,162,39,0.2) 0%, transparent 55%),
                linear-gradient(315deg, var(--green-dark) 0%, #1a3a28 40%, transparent 70%);
            border-radius: 80% 0 0 0;
            clip-path: polygon(100% 100%, 0 100%, 100% 0);
            opacity: 0.85;
        }

        /* Decorative gold lines on ribbons */
        .ribbon::after {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1.5px solid rgba(201, 162, 39, 0.45);
            border-radius: inherit;
            clip-path: inherit;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 48px 28px 12px;
            position: relative;
            z-index: 5;
        }

        /* Logo container with soft glow */
        .logo-wrap {
            width: 150px;
            height: 150px;
            margin: 0 auto 18px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrap::before {
            content: '';
            position: absolute;
            inset: -8px;
            background: radial-gradient(circle, rgba(201,162,39,0.25) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
        }

        /* SVG Logo – renewable energy emblem */
        .logo-svg {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 4px 12px rgba(15, 42, 28, 0.25));
        }

        .club-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.35rem;
            font-weight: 700;
            color: var(--green-dark);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            line-height: 1.1;
        }

        .club-title span {
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tagline {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--gold);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            padding: 0 28px;
        }

        .tagline::before,
        .tagline::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 20px;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, var(--gold));
        }

        .tagline::before {
            left: 0;
            background: linear-gradient(90deg, transparent, var(--gold));
        }

        .tagline::after {
            right: 0;
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        /* Description */
        .description {
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.65;
            color: var(--text-soft);
            padding: 18px 32px 28px;
            font-weight: 400;
        }

        /* Links */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 0 28px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 18px;
            text-decoration: none;
            background: linear-gradient(145deg, #ffffff 0%, #faf7ef 100%);
            border: 1.8px solid rgba(46, 74, 48, 0.35);
            border-radius: 16px;
            padding: 15px 22px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 
                0 4px 12px rgba(15, 42, 28, 0.06),
                inset 0 1px 0 rgba(255,255,255,0.8);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(201,162,39,0.08) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
            border-color: var(--gold);
            box-shadow: 
                0 10px 25px rgba(15, 42, 28, 0.12),
                0 0 0 1px rgba(201, 162, 39, 0.3);
            background: #fff;
        }

        .btn:hover::before {
            transform: translateX(100%);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .btn:hover .btn-icon {
            transform: scale(1.08);
        }

        .btn span {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-main);
            letter-spacing: 0.2px;
        }

        /* Platform specific colors */
        .btn-instagram .btn-icon {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
        }
        .btn-linkedin .btn-icon {
            background: #0a66c2;
            color: white;
        }
        .btn-tiktok .btn-icon {
            background: #000;
            color: white;
        }
        .btn-facebook .btn-icon {
            background: #1877f2;
            color: white;
        }
        .btn-whatsapp .btn-icon {
            background: #25d366;
            color: white;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 36px;
            padding: 0 20px;
            position: relative;
            z-index: 5;
        }

        .footer-leaf {
            font-size: 1.4rem;
            color: var(--gold);
            margin-bottom: 10px;
            opacity: 0.85;
            display: inline-block;
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .copyright {
            font-size: 0.72rem;
            color: #7a8a78;
            letter-spacing: 0.3px;
        }

        /* Subtle leaf decorations */
        .deco-leaf {
            position: absolute;
            opacity: 0.12;
            color: var(--green-mid);
            font-size: 2.8rem;
            z-index: 1;
            pointer-events: none;
        }

        .deco-leaf-1 { top: 180px; left: 12px; transform: rotate(-25deg); }
        .deco-leaf-2 { top: 320px; right: 14px; transform: rotate(35deg); font-size: 2.2rem; }
        .deco-leaf-3 { bottom: 90px; left: 20px; transform: rotate(15deg); font-size: 1.8rem; }

        /* Responsive tweaks */
        @media (max-width: 400px) {
            .club-title { font-size: 2rem; }
            .logo-wrap { width: 130px; height: 130px; }
            .logo-svg { width: 120px; height: 120px; }
            .description { padding: 14px 24px 24px; font-size: 0.9rem; }
            .links { padding: 0 20px; }
        }
    
        .logo-img {
            display: block;
            width: 78%;
            max-width: 270px;
            height: auto;
            margin: 0 auto;
            border-radius: 50%;
            filter: drop-shadow(0 10px 22px rgba(15, 42, 28, 0.28));
        }
        .header { padding: 36px 24px 4px; }
        .brand-svg { width: 1em; height: 1em; display: block; fill: currentColor; }
        .btn-icon .brand-svg { width: 22px; height: 22px; }
        .deco-leaf { width: 2.8rem; height: 2.8rem; fill: currentColor; }
        .deco-leaf-2 { width: 2.2rem; height: 2.2rem; }
        .deco-leaf-3 { width: 1.8rem; height: 1.8rem; }
        .leaf-svg { width: 1.4rem; height: 1.4rem; fill: currentColor; display: block; }
        .footer-leaf { line-height: 0; }
        .ribbon { width: 100px; height: 100px; }
    :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>
